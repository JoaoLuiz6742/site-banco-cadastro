<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>bancu dinhero</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<form id="formulario"></form>


    <div class="bloco-principal">
        <h1>BANCO DINHEIRO</h1>
        <p>Bota os dado ai pra nois guarda seu dinhero</p>
        
    
        <form id="meuFormulario">
            <label>qual seu nome todo?</label>
            <input type="text" id="nomeCompleto" placeholder="Escreve o nome aqui">

            <label>seu CPF </label>
            <input type="text" id="cpfUsuario" placeholder="00011122233">

            <label>bota uma senha secreta</label>
            <input type="password" id="senhaSecreta" placeholder="Nao conta pra ninguem">

            <button type="submit" id="botaoEnviar">CADASTRAR LOGO</button>
        </form>

        <p id="mensagemSucesso" class="sumido"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
